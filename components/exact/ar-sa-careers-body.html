  .jobs-select,
  .jobs-reset {

      border-color 220ms cubic-bezier(.2, .7, .2, 1),

      background-color 180ms ease;

  .jobs-search > svg,
  .jobs-select__button,
  .jobs-select__chevron,
  .jobs-reset svg {
    transition:
      color 180ms ease,
      stroke 180ms ease,
      transform 220ms cubic-bezier(.2, .7, .2, 1);

  .jobs-select:has(.jobs-select__button[aria-expanded="true"]),
